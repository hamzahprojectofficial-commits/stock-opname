<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

input, button {
  padding: 12px;
  width: 85%;
  margin: 10px;
  font-size: 16px;
}

button {
  background: #2d89ef;
  color: white;
  border: none;
  border-radius: 5px;
}

#loading {
  display:none;
  font-weight: bold;
  color: blue;
}

img {
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="pageLogin">
  <h2>Kode Akses</h2>
  <input id="akses" placeholder="Masukkan Kode Akses">
  <br>
  <button onclick="cekAkses()">Confirm</button>
  <p id="loginError" style="color:red"></p>
</div>

<!-- ================= SCAN ================= -->
<div id="pageScan" style="display:none;">
  <h2>Scan Barcode</h2>
  <div id="reader" style="width:300px;margin:auto"></div>
  <div id="loading">🔄 Mencari data...</div>
</div>

<!-- ================= DATA ================= -->
<div id="pageData" style="display:none;">
  <h2>Detail Barang</h2>
  <div id="result"></div>
  <img id="gambar" width="220">
  <br><br>
  <button onclick="serahTerima()">Serah Terima</button>
  <button onclick="scanUlang()">Scan Lagi</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbybgVvrJ9l8BLRSultMTsApWezZpuyYmDVYgQ_bsDc8mTTceUge9wKzWyAPHgn7ndc/exec";
const FORM_URL = "https://docs.google.com/forms/d/1PWeUxCwVkrL17fLesRwUIgykg9RRqDClPX7UqJfJuIY/prefill";

let aksesGlobal = "";
let lastData = null;
let html5QrCode;

// 🔊 SOUND
const successSound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
const errorSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

// ================= FIX GAMBAR SUPER AMAN =================
function setImage(url){
  if(!url){
    document.getElementById("gambar").src = "";
    return;
  }

  let id = "";

  try{
    if(url.includes("/file/d/")){
      id = url.split("/file/d/")[1].split("/")[0];
    } else if(url.includes("id=")){
      id = url.split("id=")[1];
    } else {
      id = url; // fallback kalau sudah ID langsung
    }
  } catch(e){
    console.log("Error parsing ID");
  }

  let img1 = "https://images.weserv.nl/?url=drive.google.com/uc?id=" + id;
  let img2 = "https://drive.google.com/thumbnail?id=" + id;

  let img = document.getElementById("gambar");

  img.src = img1;

  img.onerror = function(){
    img.src = img2;
  };
}

// ================= LOGIN =================
function cekAkses(){
  let akses = document.getElementById("akses").value;

  if(akses === "12345"){
    aksesGlobal = akses;

    document.getElementById("pageLogin").style.display = "none";
    document.getElementById("pageScan").style.display = "block";

    startScanner();
  } else {
    document.getElementById("loginError").innerText = "Kode akses salah";
  }
}

// ================= START SCANNER =================
function startScanner(){
  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (barcode) => {
      html5QrCode.stop();
      cariData(barcode);
    }
  );
}

// ================= CARI DATA =================
function cariData(barcode){

  document.getElementById("loading").style.display = "block";

  fetch(API_URL + "?barcode=" + barcode + "&akses=" + aksesGlobal)
    .then(res => res.json())
    .then(data => {

      document.getElementById("loading").style.display = "none";

      if(data.found){
        successSound.play();

        lastData = data;

        tampilData(data);

      } else {
        errorSound.play();
        alert("Data tidak ditemukan");
        startScanner();
      }

    })
    .catch(() => {
      document.getElementById("loading").style.display = "none";
      errorSound.play();
      alert("Error koneksi");
      startScanner();
    });
}

// ================= TAMPIL DATA =================
function tampilData(data){

  document.getElementById("pageScan").style.display = "none";
  document.getElementById("pageData").style.display = "block";

  document.getElementById("result").innerHTML =
    "<b>" + data.nama + "</b><br>" +
    "ID: " + data.id + "<br>" +
    "SN: " + data.sn;

  // 🔥 FIX GAMBAR DI SINI
  setImage(data.gambar);
}

// ================= SCAN ULANG =================
function scanUlang(){
  document.getElementById("pageData").style.display = "none";
  document.getElementById("pageScan").style.display = "block";
  startScanner();
}

// ================= SERAH TERIMA =================
function serahTerima(){

  if(!lastData){
    alert("Scan dulu!");
    return;
  }

  let url = FORM_URL + "?usp=pp_url"
    + "&entry.864194165=" + lastData.id
    + "&entry.1933308499=" + lastData.sn
    + "&entry.1648117374=" + lastData.nama;

  window.open(url);
}

</script>

</body>
</html>
