<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

input, button {
  padding: 10px;
  width: 80%;
  margin: 10px;
}

#loading {
  display:none;
  color: blue;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="pageLogin">
  <h2>Kode Akses</h2>
  <input id="akses" placeholder="Masukkan Kode Akses">
  <br>
  <button onclick="cekAkses()">Confirm</button>
  <p id="loginError" style="color:red"></p>
</div>

<!-- SCAN -->
<div id="pageScan" style="display:none;">
  <h2>Scan Barcode</h2>
  <div id="reader" style="width:300px;margin:auto"></div>
  <div id="loading">🔄 Mencari data...</div>
</div>

<!-- DATA -->
<div id="pageData" style="display:none;">
  <h2>Detail Barang</h2>
  <div id="result"></div>
  <img id="gambar" width="200">
  <br>
  <button onclick="serahTerima()">Serah Terima</button>
  <br>
  <button onclick="scanUlang()">Scan Lagi</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbybgVvrJ9l8BLRSultMTsApWezZpuyYmDVYgQ_bsDc8mTTceUge9wKzWyAPHgn7ndc/exec";
const FORM_URL = "https://forms.gle/EGZrXieBxnwFQs9L9";

let aksesGlobal = "";
let lastData = null;
let html5QrCode;

// 🔊 SUARA
const successSound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
const errorSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

// ================= AUTO FIX GOOGLE DRIVE LINK =================
function fixImageUrl(url){
  if(!url) return "";

  // format /file/d/
  if(url.includes("/file/d/")){
    let id = url.split("/file/d/")[1].split("/")[0];
    return "https://drive.google.com/uc?export=view&id=" + id;
  }

  // format open?id=
  if(url.includes("open?id=")){
    let id = url.split("open?id=")[1];
    return "https://drive.google.com/uc?export=view&id=" + id;
  }

  // format uc?id=
  if(url.includes("uc?id=")){
    let id = url.split("uc?id=")[1];
    return "https://drive.google.com/uc?export=view&id=" + id;
  }

  return url;
}

// ================= LOGIN =================
function cekAkses(){
  let akses = document.getElementById("akses").value;

  if(akses === "12345"){
    aksesGlobal = akses;

    document.getElementById("pageLogin").style.display = "none";
    document.getElementById("pageScan").style.display = "block";

    startScanner();
  } else {
    document.getElementById("loginError").innerText = "Kode akses salah";
  }
}

// ================= START SCANNER =================
function startScanner(){
  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (barcode) => {
      html5QrCode.stop();
      cariData(barcode);
    }
  );
}

// ================= CARI DATA =================
function cariData(barcode){

  document.getElementById("loading").style.display = "block";

  fetch(API_URL + "?barcode=" + barcode + "&akses=" + aksesGlobal)
    .then(res => res.json())
    .then(data => {

      document.getElementById("loading").style.display = "none";

      if(data.found){
        successSound.play();

        lastData = data;

        tampilData(data);

      } else {
        errorSound.play();
        alert("Data tidak ditemukan");
        startScanner();
      }

    })
    .catch(() => {
      document.getElementById("loading").style.display = "none";
      errorSound.play();
      alert("Error koneksi");
      startScanner();
    });
}

// ================= TAMPIL DATA =================
function tampilData(data){

  document.getElementById("pageScan").style.display = "none";
  document.getElementById("pageData").style.display = "block";

  document.getElementById("result").innerHTML =
    "<b>" + data.nama + "</b><br>" +
    "ID: " + data.id + "<br>" +
    "SN: " + data.sn;

  // 🔥 AUTO FIX IMAGE
  document.getElementById("gambar").src = fixImageUrl(data.gambar);
}

// ================= SCAN ULANG =================
function scanUlang(){
  document.getElementById("pageData").style.display = "none";
  document.getElementById("pageScan").style.display = "block";
  startScanner();
}

// ================= SERAH TERIMA =================
function serahTerima(){

  if(!lastData){
    alert("Scan dulu!");
    return;
  }

  let url = FORM_URL + "?usp=pp_url"
    + "&entry.864194165=" + lastData.id
    + "&entry.1933308499=" + lastData.sn
    + "&entry.1648117374=" + lastData.nama;

  window.open(url);
}

</script>

</body>
</html>
